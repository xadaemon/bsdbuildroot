# Build configuration for OC2's tier 5 computer, the PowerPC mainframe: a
# PAPR "pseries" machine (javapower) with SLOF as its firmware, its hard
# drives as disks on a v-scsi bus and its console on the hypervisor's
# virtual terminal (the block's serial port, at 9600 baud). The device bus is
# on more such terminals (the high-level API) and a PCI device (the mid-level
# API), see README.md.
#
# Sourced by scripts/build.sh (POSIX sh). Unlike the Sedna image, no world
# and no kernel are built: the image is FreeBSD's own release, the stock
# GENERIC64LE kernel and a small part of the base system, installed and ready
# to boot. Two programs are built for it, mlapi(1) and flua, see below.

# The name of the image (<NAME>.img), its data pack and its mod (mod/<NAME>).
NAME="power-bsd"

# Where the build keeps its files on the build host, and where its results go
# (<OUTPUT_DIR>/images is copied back), relative to the top of the tree.
WORK_DIR="work/power-ppc64le"
OUTPUT_DIR="output/power-ppc64le"

# What "scripts/build.sh all" runs: the release's distribution sets, and
# flua from the release's sources.
STAGES="fetch flua rootfs"

TARGET="powerpc"
TARGET_ARCH="powerpc64le"

# The distribution sets, checked against the release's MANIFEST.
DIST_SITE="https://download.freebsd.org/releases/${TARGET}/${TARGET_ARCH}/15.1-RELEASE"
DIST_SETS="base kernel"

BOARD_DIR="board/power-ppc64le"

# What of the release goes into the image: programs and data files; the
# shared libraries they need are added automatically. Lists, read in order.
USERLAND_LIST="board/common/userland.list ${BOARD_DIR}/userland.list"

# Copied over the root file system, in order.
ROOTFS_OVERLAY="board/common/rootfs-overlay ${BOARD_DIR}/rootfs-overlay"
ROOTFS_POST_BUILD_SCRIPT="${BOARD_DIR}/post-build.sh"

# mlapi(1), OC2's mid-level API from the shell: its sources, built for the
# image.
MLAPI_DIR="board/common/mlapi"

# OC2's Lua libraries for the high-level API are written against luaposix,
# of which the release's flua has little. The flua stage builds flua again
# from the release's sources (the src set, checked against the MANIFEST like
# the others) with the patch the Sedna image's flua has, and the image gets
# that one. flua's modules (/usr/lib/flua) stay the release's.
FLUA_PATCH="board/sedna-riscv64/patches/freebsd/0010-flua-add-luaposix-functions-for-oc2.patch"

# OC2's Lua libraries (lib/lua, to /usr/share/flua) and the programs of
# theirs that go to /usr/bin. The RISC-V computers get them from OC2 itself,
# on /mnt/builtin; this machine has no such file system, so the image brings
# them. The top-level Makefile copies them here from OC2's sources
# (OC2_SCRIPTS, common/src/main/scripts there).
OC2_SCRIPTS_DIR="oc2/scripts"
OC2_PROGRAMS="lsdev.lua redstone.lua import.lua export.lua oc2busd.lua"

# The disk image, DISK_LAYOUT "prep", as FreeBSD's powerpc64 VM images:
#
#   sector 0    MBR: the PReP boot partition (active), the UFS root
#   byte 4096   PReP boot partition, up to 1 MiB: PREP_BOOT, from the world.
#               SLOF loads and runs it; it finds the root file system and
#               starts /boot/loader from it.
#   1 MiB       UFS2 root file system, mounted by label: /boot/loader loads
#               the kernel, /boot/kernel/kernel.gz, from it
#   at the end  swap space, SWAP_SIZE, found by its glabel(8) label
#
# OC2 makes a hard drive exactly as large as its image: 64 MB is the
# colossal hard drive.
DISK_LAYOUT="prep"
DISK_SIZE="64M"
PREP_BOOT="boot/boot1.elf"
# Swap space. The machine has 256 MB of memory at least; empty: no swap.
SWAP_SIZE=""
SWAP_LABEL="power_swap"
ROOTFS_LABEL="power_bsd"
# makefs(8) -o options for the UFS root, for a small disk of small files.
ROOTFS_MAKEFS_OPTIONS="version=2,bsize=8192,fsize=1024,density=16384,minfree=5,optimization=space,softupdates=1"

# Hostname and welcome banner.
TARGET_HOSTNAME="localhost"
# Only for machines with a network card; this one has none.
TARGET_HOSTNAME_FROM_MAC="no"
TARGET_ISSUE="Welcome to Power BSD"
