# Build configuration for the Sedna RISC-V board, FreeBSD edition.
#
# Sourced by scripts/build.sh (POSIX sh). The counterpart of the Linux tree's
# configs/sedna-riscv64_defconfig.

# The name of the image (<NAME>.img), its data pack and its mod (mod/<NAME>).
NAME="sedna-freebsd"

# Where the build keeps its files on the build host, and where its results go
# (<OUTPUT_DIR>/images is copied back), relative to the top of the tree.
WORK_DIR="work"
OUTPUT_DIR="output"

# What "scripts/build.sh all" runs: FreeBSD built from (patched) sources.
STAGES="src world kernel install firmware rootfs"

# FreeBSD sources. A shallow clone of this branch is kept in work/src.
FREEBSD_REPO="https://git.FreeBSD.org/src.git"
FREEBSD_BRANCH="releng/15.1"

TARGET="riscv"
TARGET_ARCH="riscv64"

BOARD_DIR="board/sedna-riscv64"

# Build options for buildworld/buildkernel, see src.conf(5).
SRCCONF="${BOARD_DIR}/src.conf"

# Kernel configuration, in ${BOARD_DIR}/kernel.
KERNCONF="SEDNA"

# Patches applied on top of the FreeBSD sources, in order.
PATCH_DIR="${BOARD_DIR}/patches/freebsd"

# What of the installed world goes into the image: programs and data files;
# the shared libraries they need are added automatically. Lists, read in
# order.
USERLAND_LIST="board/common/userland.list ${BOARD_DIR}/userland.list"

# Copied over the root file system, in order.
ROOTFS_OVERLAY="board/common/rootfs-overlay ${BOARD_DIR}/rootfs-overlay"
ROOTFS_POST_BUILD_SCRIPT="${BOARD_DIR}/post-build.sh"

# mlapi(1), OC2's mid-level API from the shell: its sources, built for the
# image.
MLAPI_DIR="board/common/mlapi"

# The disk image, DISK_LAYOUT "sedna". sedna-fw (the board firmware, shipped
# with OC2) treats the whole disk as one ext2 file system and loads
# /boot/Image from it. ext2 leaves the first 1024 bytes alone, so the disk is
# laid out as
#
#   sector 0    MBR: the UFS root, and the swap space if any
#   byte 1024   small ext2 file system holding only /boot/Image (sedna-fw)
#   after it    UFS2 root file system, mounted by label (ROOTDEVNAME)
#   at the end  swap space, SWAP_SIZE, found by its glabel(8) label
#
# OC2 makes a hard drive exactly as large as its image. The root gets what
# the boot area and the swap space leave: 19 MB here, ~6 MB of it free.
DISK_LAYOUT="sedna"
DISK_SIZE="40M"
# Swap space. A computer has 32 MB of memory at most, and the kernel keeps
# ~13 MB of it, so swap lets programs that sit idle (oc2busd between calls,
# a shell) make room for others. Empty: no swap.
SWAP_SIZE="16M"
SWAP_LABEL="sedna_swap"
# Size of the ext2 boot area in MiB; empty: the kernel plus some slack.
BOOTFS_SIZE=""
BOOTFS_LABEL="sedna_boot"
ROOTFS_LABEL="sedna_freebsd"
# makefs(8) -o options for the UFS root, for a small disk of small files.
ROOTFS_MAKEFS_OPTIONS="version=2,bsize=8192,fsize=1024,density=16384,minfree=5,optimization=space,softupdates=1"

# Hostname and welcome banner.
TARGET_HOSTNAME="localhost"
# yes: like the Linux image, a machine still called "localhost" at boot is
# renamed after its network card's MAC (sedna-xxxxxx), and keeps that name
# (it is written to /etc/hostname). Adds ${BOARD_DIR}/hostname-from-mac.
# no: the hostname is TARGET_HOSTNAME.
TARGET_HOSTNAME_FROM_MAC="no"
TARGET_ISSUE="Welcome to Sedna"

# Firmware sources, optional. sedna-fw is the board firmware from the Linux
# tree; it is the same for both systems and is built here only so the images
# can be booted without the Linux build. Relative to the top of this tree.
SEDNA_FW_SRC="fw/sedna-fw"
