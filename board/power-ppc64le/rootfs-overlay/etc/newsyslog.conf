# newsyslog.conf(5). /var/log is a memory file system of 1 MB (/etc/fstab):
# newsyslog creates the logs there at boot (C), and cron(8) has it turn
# them over every hour once they are large, compressed (Z, gzip).
#
# logfilename		mode count size(KB) when flags
/var/log/messages	644  3	   200	    *	 CZ
/var/log/auth.log	600  2	   50	    *	 CZ
