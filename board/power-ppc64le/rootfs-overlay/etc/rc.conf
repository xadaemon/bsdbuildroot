# rc.conf(5): what the system starts at boot. This file only has what
# differs from /etc/defaults/rc.conf; sysrc(8) reads and changes it
# (sysrc -a, sysrc name=value), service(8) starts and stops things
# (service -e lists what is on).
#
# The image has the rc.d scripts of what it has programs for, not all of
# FreeBSD's: service -l lists them.

# OC2 computers are often just switched off: check file systems before they
# are mounted, not in the background, and repair what a plain check cannot.
background_fsck="NO"
fsck_y_enable="YES"
# /tmp, /var/log and /run are memory file systems of /etc/fstab already.
tmpmfs="NO"
varmfs="NO"
# No swap space to dump the kernel's memory to.
dumpdev="NO"

# Kernel modules to load at boot; the loader cannot load them on this
# machine. geom_stripe: striped volumes, gstripe(8).
kld_list="geom_stripe"

# Local only: no network sockets.
syslogd_flags="-ss"

# The image's own: the other disks, mounted at /mnt (mountdisks(8)), and
# OC2's bus daemon.
mountdisks_enable="YES"
oc2busd_enable="YES"

