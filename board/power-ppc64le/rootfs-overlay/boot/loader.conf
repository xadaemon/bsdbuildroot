# loader.conf(5). The defaults are in /boot/defaults/loader.conf; the root
# file system comes from /etc/fstab.

# Boot without the menu, after a short pause: the console is a 9600 baud
# line.
beastie_disable="YES"
autoboot_delay="2"

# The image has no /boot/entropy to load.
entropy_cache_load="NO"

# The kernel waits 5 s for SCSI devices to settle by default; the machine's
# virtual disks are there at once.
kern.cam.scsi_delay="500"

# No modules from here (<name>_load="YES"): this loader turns them down,
# "module 'kernel' exists but with wrong version". rc(8) loads what
# kld_list in /etc/rc.conf names.

# A file system on a striped volume is also seen on one of the volume's
# disks, the one with its superblock, and GEOM names that by the file
# system's id, /dev/ufsid/<id>; the stripe class then complains that it
# "cannot add" that to the volume, at every boot. Nothing here uses those
# names (disks are found by volume label, /dev/ufs/<label>).
kern.geom.label.ufsid.enable="0"
