# src.conf(5) for the Sedna build.
#
# The world is installed into a staging directory, and the image picks a
# small part of it (userland.list). Switch off whatever the image will never
# contain, to keep the build short.

# Use the host's clang/lld (FreeBSD 15.1, same version as the sources) as the
# cross compiler instead of bootstrapping one.
WITHOUT_CLANG_BOOTSTRAP=yes
WITHOUT_LLD_BOOTSTRAP=yes
# And no compiler, linker or debugger for the target itself.
WITHOUT_TOOLCHAIN=yes

# Small machine, no IPv6 (same as the Linux image).
WITHOUT_INET6=yes

WITHOUT_ACCT=yes
WITHOUT_AUDIT=yes
WITHOUT_AUTHPF=yes
WITHOUT_AUTOFS=yes
