org.gradle.jvmargs=-Xmx2g

minecraftVersion=1.21.1
fabricLoaderVersion=0.19.3
fabricApiVersion=0.116.15+1.21.1
neoforgeVersion=21.1.248

# Each mod's board (../board/<board>), the disk image it bundles, and where
# `gradlew :<mod>:dist` puts the jars. Relative to this directory; the
# Makefile passes the image and dist directory.
sedna-freebsd.board=sedna-riscv64
sedna-freebsd.image=../output/images/sedna-freebsd.img
sedna-freebsd.dist=../output/mod
power-bsd.board=power-ppc64le
power-bsd.image=../output/power-ppc64le/images/power-bsd.img
power-bsd.dist=../output/power-ppc64le/mod
