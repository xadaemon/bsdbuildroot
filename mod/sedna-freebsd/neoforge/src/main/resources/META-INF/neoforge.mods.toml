modLoader = "javafml"
loaderVersion = "[4,)"
license = "BSD-2-Clause"

[[mods]]
modId = "sedna_freebsd"
version = "${version}"
displayName = "Sedna FreeBSD"
authors = "Matheus Xavier"
description = '''
FreeBSD for OpenComputers II: a bootable hard drive image, as a data pack in every world. The version is the FreeBSD release on the image and the image's build number.
'''
# Server side: OC2 sends the drive list to clients, so clients without this
# mod can join a server that has it.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.sedna_freebsd]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraftVersion}]"
ordering = "NONE"
side = "BOTH"

# Any OC2 version: the pack only needs OC2's block_devices data format.
[[dependencies.sedna_freebsd]]
modId = "oc2"
type = "required"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"
